version: 2
project_name: pho

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: pho
    main: ./cmd/pho
    binary: pho
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
    flags:
      - -trimpath

archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE*]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  abbrev: 7
  filters:
    exclude: ["^docs:", "^test:", "^chore:", "Merge pull request", "Merge branch"]

release:
  github:
    owner: utkarsh261
    name: pho
  prerelease: auto

homebrew_casks:
  - name: pho
    repository:
      owner: utkarsh261
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/utkarsh261/pho
    description: A TUI for GitHub pull requests
    license: GPL-3.0-or-later
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "pho {{ .Tag }}"
    dependencies:
      - formula: gh
    hooks:
      post:
        # The binaries aren't notarized; drop the quarantine flag so
        # Gatekeeper doesn't block the first run.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/pho"]
          end
