name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Same approach as most third-party taps (e.g. litestream): a formula
  # that installs the prebuilt binary. Homebrew only quarantines cask
  # downloads, so this needs no signing or post-install hooks.
  homebrew:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: utkarsh261/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Update Formula/pho.rb
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          base="https://github.com/utkarsh261/pho/releases/download/${TAG}"
          sums=$(curl -fsSL "${base}/checksums.txt")
          sha() { echo "$sums" | grep " pho_${version}_$1.tar.gz$" | cut -d' ' -f1; }
          mkdir -p Formula
          cat > Formula/pho.rb <<RUBY
          class Pho < Formula
            desc "TUI for GitHub pull requests"
            homepage "https://github.com/utkarsh261/pho"
            version "${version}"
            license "GPL-3.0-or-later"

            depends_on "gh"

            on_macos do
              on_arm do
                url "${base}/pho_${version}_macOS_arm64.tar.gz"
                sha256 "$(sha macOS_arm64)"
              end
              on_intel do
                url "${base}/pho_${version}_macOS_amd64.tar.gz"
                sha256 "$(sha macOS_amd64)"
              end
            end

            on_linux do
              on_arm do
                url "${base}/pho_${version}_linux_arm64.tar.gz"
                sha256 "$(sha linux_arm64)"
              end
              on_intel do
                url "${base}/pho_${version}_linux_amd64.tar.gz"
                sha256 "$(sha linux_amd64)"
              end
            end

            def install
              bin.install "pho"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/pho --version")
            end
          end
          RUBY
          if grep -q 'sha256 ""' Formula/pho.rb; then
            echo "missing checksum in checksums.txt" >&2
            exit 1
          fi
          git rm -q --ignore-unmatch Casks/pho.rb
          git add Formula/pho.rb
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com \
            commit -m "pho ${TAG}" || exit 0
          git push
